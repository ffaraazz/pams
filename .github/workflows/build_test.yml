# Build & Test workflow for PAMS (.NET 10 + PostgreSQL via Testcontainers)
# - Builds the solution, then runs unit and integration tests in parallel.
# - Integration tests use Testcontainers (auto-pulls postgres:17); no external services needed.
# - Auth is bypassed in tests via TestAuthHandler — no Keycloak required.

name: Build & Test

on:
  workflow_dispatch:
  # TODO: remove push trigger after adding branch protection rules
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Persist the build output so test jobs don't need to rebuild
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/**
            **/obj/**
          retention-days: 1

  # ── 2a. Unit Tests (no Docker required) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run Unit Tests
        run: >
          dotnet test tests/PAMS.UnitTests/PAMS.UnitTests.csproj
          --no-build
          --configuration Release
          --verbosity normal

  # ── 2b. Integration Tests (Docker is pre-installed on ubuntu-latest) ────
  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Testcontainers auto-pulls postgres:17 — Docker is already available
      # Testcontainers auto-pulls postgres:17 — Docker is already available
      - name: Run Integration Tests
        run: >
          dotnet test tests/PAMS.IntegrationTests/PAMS.IntegrationTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
